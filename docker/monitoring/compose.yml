# Stack di monitoring per il VPS: Prometheus + Grafana + exporter.
#
# Vive in un compose SEPARATO dallo stack app: il suo ciclo di vita è
# indipendente dai deploy (il CD ricrea l'app, non il monitoring).
# Config locale in docker/monitoring/.env (fuori git, vedi .env.example).
#
# Avvio sul VPS:
#   cd /opt/yii3 && docker compose --env-file docker/monitoring/.env \
#     -f docker/monitoring/compose.yml up -d --wait
#
# Esposizione: SOLO Grafana, via caddy-docker-proxy con TLS su
# https://${GRAFANA_HOST}. Prometheus e gli exporter restano su rete
# interna (per il debug: tunnel SSH verso prometheus:9090).

services:
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    ports:
      # Solo loopback del VPS: UI raggiungibile via tunnel SSH
      # (ssh -L 9090:127.0.0.1:9090 deploy@<VPS_IP>).
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      # caddy_public serve solo a raggiungere caddy-proxy:9180 (metriche).
      - caddy_public
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in docker/monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:?Set GRAFANA_HOST in docker/monitoring/.env}
      # Notifiche alert: il contact point Telegram provisionato
      # (grafana/provisioning/alerting/) espande queste variabili.
      # Obbligatorie: senza, Grafana partirebbe con un contact point rotto.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in docker/monitoring/.env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in docker/monitoring/.env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - caddy_public
    labels:
      caddy: ${GRAFANA_HOST}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    # privileged + mount di sistema: richiesti da cAdvisor per leggere
    # cgroup e stato dei container dal host.
    # NB: se Docker usa lo snapshotter containerd (storage driver
    # "overlayfs") cAdvisor esporta solo il cgroup root, niente serie
    # per-container: limite upstream, presente anche in v0.52. Con il
    # classico overlay2 funziona per intero. Per questo l'alert sull'app
    # si basa sugli upstream di Caddy, non su cAdvisor.
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.12@sha256:c2a6860c2f94ecc98fffce7c10e6c8b350cf25e2ea3daa255dff27d7c6a4dffc
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.1@sha256:7790f6f7fbd8e4486b4b6c6fc6a7293a73605bb79aaa7f49003cb366943724f6
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Socket in sola lettura: service discovery + tail dei log container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Volume runtime dell'app (external): raccoglie runtime/logs/app.log.
      - app_runtime:/app-runtime:ro
    networks:
      - monitoring
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0@sha256:617b7244a31922c30eeddb0e3b39b4c125e890d46179be4a30561b20f111ca6c
    # Si collega al MySQL dello stack app attraverso la sua network
    # (external): serve l'utente dedicato "exporter" con soli grant di
    # monitoraggio (PROCESS, REPLICATION CLIENT, SELECT ON *.*).
    command:
      - --mysqld.username=${MYSQLD_EXPORTER_USER:-exporter}
      - --mysqld.address=db:3306
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?Set MYSQLD_EXPORTER_PASSWORD in docker/monitoring/.env}
    networks:
      - monitoring
      - app_internal
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
  loki_data:
  alloy_data:
  app_runtime:
    name: ${APP_RUNTIME_VOLUME:-yii3-template-prod_runtime}
    external: true

networks:
  monitoring:
  caddy_public:
    external: true
  app_internal:
    name: ${APP_NETWORK:-yii3-template-prod_app_internal}
    external: true
