name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA completo (40 caratteri) dell'immagine e del commit da deployare"
        required: true
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      # DEPLOY_SHA è l'unica fonte di verità per immagine e checkout. Gli
      # input GitHub passano dall'env: mai interpolare dati esterni nel Bash.
      - name: Resolve deployment target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            DEPLOY_SHA="$WORKFLOW_RUN_SHA"
          else
            DEPLOY_SHA="$MANUAL_IMAGE_TAG"
          fi

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag deve essere uno SHA Git completo di 40 caratteri (niente latest o SHA abbreviati)"
            exit 1
          fi

          APP_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"
          {
            echo "DEPLOY_SHA=$DEPLOY_SHA"
            echo "APP_IMAGE=$APP_IMAGE"
          } >> "$GITHUB_ENV"
          echo "Target di deploy: commit $DEPLOY_SHA, immagine $APP_IMAGE"

      - name: Login to GHCR for image preflight
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fallire prima dell'SSH: un tag assente non deve cambiare il checkout
      # sul VPS né produrre un backup per un deploy che non può iniziare.
      - name: Verify image manifest
        run: docker manifest inspect "$APP_IMAGE" > /dev/null

      # Il workflow esegue l'helper appartenente alla propria revisione:
      # la logica remota resta versionata, non duplicata in un heredoc.
      - name: Checkout deployment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Setup SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # tr -d '\r' tollera un secret incollato con fine riga Windows.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Un secret vuoto o senza la riga per VPS_HOST emergerebbe solo come
          # "Host key verification failed" (exit 255) opaco al primo ssh.
          ssh-keygen -F "${{ secrets.VPS_HOST }}" -f ~/.ssh/known_hosts > /dev/null || {
            echo "::error::VPS_KNOWN_HOSTS non contiene una riga known_hosts per l'host di VPS_HOST"
            exit 1
          }

      - name: Update repo files on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" \
            < scripts/checkout-deploy-commit.sh

      # La logica di backup e deploy vive in scripts/*.sh, versionati nel
      # repo e allineati sul VPS dallo step precedente: il workflow li
      # INVOCA soltanto. Mai heredoc via stdin: docker compose run/exec
      # leggono stdin e divorano il resto dello script (deploy "verdi" ma
      # interrotti a metà, 2026-07-04).
      - name: Backup DB on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -eu
             ACTUAL_SHA=\$(git -c safe.directory=/opt/yii3 -C /opt/yii3 rev-parse HEAD)
             if [ \"\$ACTUAL_SHA\" != \"$DEPLOY_SHA\" ]; then
               echo \"ERRORE: checkout VPS \$ACTUAL_SHA, atteso $DEPLOY_SHA prima del backup\" >&2
               exit 1
             fi
             echo \"Checkout VPS verificato prima del backup: \$ACTUAL_SHA\"
             bash /opt/yii3/scripts/backup-db.sh"

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -eu
             ACTUAL_SHA=\$(git -c safe.directory=/opt/yii3 -C /opt/yii3 rev-parse HEAD)
             if [ \"\$ACTUAL_SHA\" != \"$DEPLOY_SHA\" ]; then
               echo \"ERRORE: checkout VPS \$ACTUAL_SHA, atteso $DEPLOY_SHA prima del deploy\" >&2
               exit 1
             fi
             echo \"Checkout VPS verificato prima del deploy: \$ACTUAL_SHA\"
             APP_IMAGE='$APP_IMAGE' bash /opt/yii3/scripts/deploy.sh"
