name: CI

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    name: Docker Compose CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate operational files
        run: make validate-ops

      - name: Test local Makefile workflow
        run: bash tests/Tooling/makefile-workflow.sh

      - name: Test CI image workflow
        run: bash tests/Tooling/ci-image-workflow.sh

      - name: Test deployment checkout helper
        run: bash tests/Deploy/checkout-deploy-commit.sh

      # I report informativi devono restare completi: TRIVY_IGNOREFILE vuoto
      # perché .trivyignore (raccolto di default dalla cwd) vale solo per i
      # gate bloccanti, non deve nascondere le eccezioni accettate.
      - name: Run Trivy filesystem and config scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          exit-code: '0'
          version: v0.71.2
          cache: 'true'

      # Gate bloccante (C-01/F-03): vulnerabilità HIGH/CRITICAL con fix
      # disponibile non devono entrare. Il report completo resta nello step
      # informativo sopra; eccezioni solo via .trivyignore, ognuna con
      # motivazione e scadenza.
      - name: Enforce Trivy gate on fixable HIGH/CRITICAL (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.71.2
          cache: 'true'
          skip-setup-trivy: 'true'

      - name: Configure Docker user
        run: |
          mkdir -p runtime/cache/composer
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      # --pull: il tag base frankenphp è mobile, ogni build deve partire
      # dalla base più recente (bump C-01), non da una cache stantia.
      - name: Build services
        run: docker compose -f compose.yml build --pull

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          scan-type: image
          image-ref: yii3-template-app:latest
          scanners: vuln,misconfig,secret
          format: table
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          version: v0.71.2
          cache: 'true'
          skip-setup-trivy: 'true'

      - name: Install Composer dependencies
        run: docker compose -f compose.yml run --rm --no-deps app composer install --no-interaction --prefer-dist

      - name: Validate Composer configuration
        run: docker compose -f compose.yml run --rm --no-deps app composer validate

      - name: Audit Composer dependencies
        run: docker compose -f compose.yml run --rm --no-deps app composer audit --no-interaction

      - name: Run Psalm static analysis
        run: docker compose -f compose.yml run --rm --no-deps app ./vendor/bin/psalm --no-progress --no-cache --output-format=github

      - name: Run Codeception tests
        run: |
          if [ -f codeception.yml ] || [ -f codeception.dist.yml ]; then
            docker compose -f compose.yml run --rm --no-deps app ./vendor/bin/codecept run --skip-group database
          else
            echo "Codeception is not configured; skipping tests."
          fi

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm \
            -v "$PWD/docker/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Loki config
        run: |
          docker run --rm \
            -v "$PWD/docker/monitoring/loki:/etc/loki:ro" \
            grafana/loki:3.5.0 \
            -config.file=/etc/loki/loki-config.yml -verify-config

      - name: Validate Alloy config
        run: |
          docker run --rm \
            -v "$PWD/docker/monitoring/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.8.1 \
            fmt /etc/alloy/config.alloy > /dev/null

      - name: Validate framework migrations
        run: |
          docker compose -f compose.yml up -d --wait db
          # Idempotenza: le migration rieseguono gli snapshot sopra lo schema
          # già creato da initdb.d (stesso scenario del primo run in prod).
          docker compose -f compose.yml run --rm app ./yii migrate:up -y
          # Bootstrap da zero: un DB vuoto deve essere ricostruibile dalla
          # sola catena di migration (disaster recovery / ambiente dev nuovo).
          docker compose -f compose.yml exec -T db mysql -e "DROP DATABASE yii3_template; CREATE DATABASE yii3_template;"
          docker compose -f compose.yml run --rm app ./yii migrate:up -y
          docker compose -f compose.yml run --rm app ./yii migrate:history

      - name: Run database-group tests
        run: |
          # Il run principale esclude il gruppo "database" (gira con --no-deps,
          # senza MySQL): qui il gruppo viene eseguito contro il DB della CI
          # appena ricostruito dalla catena di migration.
          set -o pipefail
          docker compose -f compose.yml run --rm app ./vendor/bin/codecept run -g database --no-colors | tee /tmp/database-tests.log
          # Guardia anti-regressione: se il gruppo smette di eseguire test
          # (rinominato, svuotato, escluso) lo step deve fallire, non tacere.
          grep -Eq "OK \([1-9][0-9]* test" /tmp/database-tests.log

      - name: Stop services
        if: always()
        run: docker compose -f compose.yml down --remove-orphans

  image:
    name: Verify and publish app image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare image tags
        id: image-tags
        run: |
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "sha=${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image_name}:latest" >> "$GITHUB_OUTPUT"

      # Questa è l'unica build prod del workflow: gli step successivi
      # verificano, scansionano e pubblicano la stessa immagine locale.
      - name: Build app image
        env:
          IMAGE_TAG_SHA: ${{ steps.image-tags.outputs.sha }}
        run: DOCKER_BUILDKIT=1 docker build --file docker/Dockerfile --target prod --pull --tag "$IMAGE_TAG_SHA" .

      - name: Verify prod image artifact
        env:
          IMAGE_TAG_SHA: ${{ steps.image-tags.outputs.sha }}
        run: |
          # Il CD esegue ./yii migrate:up DALL'IMMAGINE, non dal checkout
          # bind-montato: questi file devono esistere nell'artefatto
          # (esclusioni .dockerignore e bit di esecuzione inclusi).
          docker run --rm --entrypoint sh "$IMAGE_TAG_SHA" -c '
            set -e
            test -x /app/yii
            test -f /app/database/migrations/release_1_0_0.sql
            test -f /app/database/migrations/release_1_0_1.sql
            test -f /app/database/migrations/release_1_0_2.sql
            test -f /app/database/seeders/release_1_0_0.sql
            test -d /app/vendor
            echo "Artefatto prod: OK"
          '

      # Gate bloccante sull'artefatto che va davvero in produzione (C-01):
      # è l'immagine prod, non quella dev, a spedire le vulnerabilità.
      - name: Enforce Trivy gate on fixable HIGH/CRITICAL (prod image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-tags.outputs.sha }}
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.71.2
          cache: 'true'

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG_SHA: ${{ steps.image-tags.outputs.sha }}
          IMAGE_TAG_LATEST: ${{ steps.image-tags.outputs.latest }}
        run: |
          docker tag "$IMAGE_TAG_SHA" "$IMAGE_TAG_LATEST"
          docker push "$IMAGE_TAG_SHA"
          docker push "$IMAGE_TAG_LATEST"
