name: Task per agente AI
description: Attività destinata a un agente (Codex, Claude Code), con perimetro e criteri di done
title: "[AI] "
labels: ["ai-task"]
body:
  - type: markdown
    attributes:
      value: |
        L'agente lavora secondo le regole di `AGENTS.md` (importate anche da
        `CLAUDE.md`): qui vanno solo la task e il suo perimetro, non le
        regole. Prompt di esecuzione: `docs/ai/prompts/implementa-issue.md`.
  - type: textarea
    id: compito
    attributes:
      label: Compito
      description: Cosa deve fare l'agente, in termini verificabili.
    validations:
      required: true
  - type: textarea
    id: riferimenti
    attributes:
      label: File e riferimenti
      description: Percorsi rilevanti, issue/analisi collegate, runbook da citare.
  - type: textarea
    id: done
    attributes:
      label: Criteri di done
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verifiche
    attributes:
      label: Verifiche da eseguire
      description: I comandi attesi prima della consegna (test mirati, psalm, smoke).
  - type: textarea
    id: vincoli
    attributes:
      label: Vincoli specifici
      description: Solo quelli aggiuntivi rispetto ad AGENTS.md (perimetro file, cosa non toccare).
