version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker/prod
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker/proxy
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker/monitoring
    schedule:
      interval: weekly
